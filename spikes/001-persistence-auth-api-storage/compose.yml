services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weyne_spike
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: weyne
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weyne -d weyne_spike"]
      interval: 2s
      timeout: 2s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      - MINIO_ROOT_PASSWORD
      - MINIO_ROOT_USER
    ports:
      - "127.0.0.1:59000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
