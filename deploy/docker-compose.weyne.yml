# ─────────────────────────────────────────────────────────────────────────
# Weyne Representações — production stack (masoria-vps).
#
# Fully ISOLATED from the masoria stack: its own compose project (`weyne`),
# its own network, and its own Cloudflare tunnel. It shares only the Docker
# daemon, so nothing here can affect masoria.
#
#   cd ~/weyne
#   docker compose --env-file .env.weyne pull
#   docker compose --env-file .env.weyne up -d
#
# Ingress: Cloudflare edge (TLS) → tunnel → Caddy web:80 → app:3000.
# No host ports are published; the VPS exposes nothing new to the internet.
# ─────────────────────────────────────────────────────────────────────────
name: weyne

services:
  migrate:
    image: ${WEYNE_IMAGE:?set WEYNE_IMAGE to an immutable GHCR tag or digest in .env.weyne}
    command: ["node", "dist/server/migrate.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.weyne}
      MIGRATION_CLEANUP_RELEASE: ${MIGRATION_CLEANUP_RELEASE:-}
    restart: "no"
    networks: [edge]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ${WEYNE_IMAGE:?set WEYNE_IMAGE to an immutable GHCR tag or digest in .env.weyne}
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.weyne}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3000}
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: caddy:2-alpine
    restart: always
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      # Dedicated 'weyne' tunnel token (Zero Trust → Networks → Tunnels).
      # This is NOT the account API token. `:?` fails the deploy loudly if unset.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env.weyne}
    restart: always
    depends_on: [web]
    networks: [edge]
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    name: weyne_edge
