name: weyne-storage

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-weyne-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-weyne-local-secret-change-me}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-weyne-private}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-weyne-local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-weyne-local-secret-change-me}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc anonymous set none "local/$${S3_BUCKET}"
        mc stat "local/$${S3_BUCKET}"
    restart: "no"

volumes:
  minio-data:
